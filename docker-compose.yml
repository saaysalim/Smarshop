services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartshop
      POSTGRES_USER: smartshop
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env file}"
    ports:
      - "5432:5432"
    volumes:
      - smartshop_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartshop -d smartshop"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: "postgresql+psycopg://smartshop:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env file}@db:5432/smartshop"
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  smartshop_db:
